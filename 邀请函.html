<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>百廿芳华 · 校庆邀请函</title>
<style>
:root{--red:#a72624;--gold:#d8b57b;--paper:#fff2e5}*{box-sizing:border-box}body{margin:0;background:#251b19;color:var(--gold);font-family:"Songti SC","SimSun",serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #fff;outline-offset:5px}.stage{position:relative;max-width:480px;margin:auto;height:100svh;min-height:620px;overflow:hidden;background:var(--red);box-shadow:0 0 80px #0005}.screen{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.2,.7,.2,1),opacity .8s;overflow:auto}.cover{z-index:2;display:flex;align-items:center;flex-direction:column;padding:60px 28px 28px;background:radial-gradient(ellipse at 50% 25%,#bf3430,var(--red) 70%);transform-origin:left center}.cover:before,.letter:before{content:"";position:absolute;inset:18px;border:1px solid #d8b57b66;pointer-events:none}.brand{font-size:12px;letter-spacing:4px;margin:0;text-align:center}.rule{width:46px;height:1px;background:var(--gold);margin:24px auto}.anniversary{position:relative;text-align:center;margin-top:5px}.number{font:120px/1 Georgia,serif;color:transparent;-webkit-text-stroke:1px var(--gold);letter-spacing:-12px;padding-right:12px}.anniversary small{display:block;font-size:13px;letter-spacing:8px;margin-top:5px}.cover h1{font-weight:400;font-size:39px;letter-spacing:12px;margin:26px 0 4px;padding-left:12px}.english{font:11px Georgia,serif;letter-spacing:5px;margin:0}.campus{width:calc(100% + 38px);height:auto;flex-shrink:0;margin:28px -19px 10px;overflow:visible;color:var(--gold)}.campus path,.campus rect,.campus line{vector-effect:non-scaling-stroke}.campus .draw{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 3.5s ease forwards}.years{font:21px Georgia,serif;letter-spacing:6px;margin:6px 0 22px}.open{color:var(--gold);border:1px solid #d8b57b99;background:transparent;border-radius:50%;width:66px;height:66px;position:relative;box-shadow:0 0 0 7px #d8b57b0b;animation:breathe 3s infinite}.hint{font-size:10px;letter-spacing:3px;margin-top:17px;opacity:.7}.bottom{margin-top:auto;padding-top:18px;font-size:12px;letter-spacing:7px}.music{position:absolute;z-index:5;right:30px;top:28px;width:34px;height:34px;border-radius:50%;border:1px solid currentColor;background:#a72624;color:#efd2a1;font-size:18px}.music.playing{animation:rotate 8s linear infinite}.letter{background:var(--paper);color:#785b3b;opacity:0;transform:translateX(25%) scale(.97);padding:47px 36px 36px}.letter:before{border:2px solid var(--red);inset:15px}.letter .brand{color:var(--red);font-size:11px;letter-spacing:3px}.letter .campus{margin:15px -12px 0;width:calc(100% + 24px);color:#b58b53}.letter h2{text-align:center;color:var(--red);font-weight:400;font-size:28px;letter-spacing:5px;margin:18px 0 8px}.subtitle{text-align:center;font-size:12px;letter-spacing:3px;padding-bottom:22px;border-bottom:1px solid #b58b5360}.copy{font-size:14px;line-height:2;letter-spacing:1px;margin-top:23px}.copy p{margin:0 0 13px}.salutation{color:var(--red)}.details{border-top:1px solid #b58b5360;border-bottom:1px solid #b58b5360;padding:15px 0;margin:23px 0;display:grid;grid-template-columns:45px 1fr;gap:8px;font-size:12px;line-height:1.7}.details b{color:var(--red);font-weight:400;letter-spacing:3px}.signature{text-align:right;font-size:12px;line-height:1.9}.back{display:block;margin:25px auto 0;border:0;border-bottom:1px solid #ad8555;background:none;color:#947344;padding:6px;font-size:11px;letter-spacing:2px}.demo{text-align:center;font-size:9px;opacity:.6;margin-top:15px;letter-spacing:1px}.opened .cover{transform:translateX(-105%) rotateY(-12deg);opacity:0;pointer-events:none}.opened .letter{transform:none;opacity:1}.opened .letter .reveal{animation:rise 1s both .5s}.opened .letter .copy{animation-delay:.7s}.opened .letter .details{animation-delay:.85s}.petal{position:absolute;width:3px;height:3px;background:#edd09a;box-shadow:0 0 6px #ffe0aa;border-radius:50%;opacity:0;pointer-events:none;animation:float 7s infinite;left:var(--x);top:70%;animation-delay:var(--d)}@keyframes draw{to{stroke-dashoffset:0}}@keyframes breathe{50%{box-shadow:0 0 0 12px #d8b57b15}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes float{20%{opacity:.5}80%{opacity:0}to{transform:translate(20px,-400px)}}@media(max-height:730px){.cover{padding-top:45px}.number{font-size:96px}.cover h1{margin-top:19px;font-size:34px}.cover .campus{margin-top:20px}.years{margin-bottom:15px}.rule{margin:18px auto}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}.campus .draw{stroke-dashoffset:0}}
</style></head>
<body><main class="stage" id="stage"><button class="music" id="music" aria-label="播放示例音乐" aria-pressed="false" title="播放示例音乐">♫</button>
<section class="screen cover" id="cover" aria-label="邀请函封面"><p class="brand" data-field="school"></p><div class="rule"></div><div class="anniversary"><div class="number">120</div><small>百 廿 芳 华</small></div><h1>邀请函</h1><p class="english">INVITATION</p><div class="art"></div><p class="years">1904 — 2024</p><button class="open" id="open" aria-label="开启邀请函">启</button><p class="hint">轻触开启 · 共赴芳华</p><p class="bottom">公 勇 诚 朴</p></section>
<section class="screen letter" id="letter" aria-label="邀请函正文" inert><p class="brand" data-field="school"></p><div class="art"></div><h2 class="reveal" data-field="headline"></h2><p class="subtitle reveal">百廿校庆 · 诚邀莅临</p><div class="copy reveal"><p class="salutation" data-field="salutation"></p><p data-field="paragraph1"></p><p data-field="paragraph2"></p></div><div class="details reveal"><b>时间</b><span data-field="date"></span><b>地点</b><span data-field="venue"></span><b>活动</b><span data-field="agenda"></span></div><div class="signature"><span data-field="organizer"></span><br><span data-field="issued"></span></div><button class="back" id="back">返回封面</button><p class="demo">试用版 · 所有活动信息均为示例</p></section></main>
<script>
// 修改这里即可替换示例文字。若有正式音乐，将 musicUrl 填为音频地址或同目录文件名。
const invitation={school:'示例中学 · 创校一百二十周年',headline:'木铎金声 行健致远',salutation:'尊敬的校友、嘉宾：',paragraph1:'弦歌不辍，薪火相传。一百二十载春秋，镌刻求知的足迹；一代代师生，续写育人的华章。',paragraph2:'值此百廿华诞，我们诚挚邀请您重返校园，共叙同窗情谊，共赏校园新貌。一同回望岁月，与母校再赴新程。',date:'2024年11月29日（星期五）\n09:00 — 11:30',venue:'示例中学 · 校园礼堂',agenda:'校庆典礼 / 校史展览 / 校友交流',organizer:'示例中学校庆筹备组',issued:'2024年11月',musicUrl:''};
document.querySelectorAll('[data-field]').forEach(el=>{el.textContent=invitation[el.dataset.field];el.style.whiteSpace='pre-line'});
const svg=`<svg class="campus" viewBox="0 0 440 155" fill="none" stroke="currentColor" stroke-width=".7" aria-label="金色校园建筑线描" role="img"><defs><pattern id="windows" width="15" height="17" patternUnits="userSpaceOnUse"><path d="M3 2h8v12H3zM7 2v12M3 8h8" opacity=".65"/></pattern></defs><g class="draw"><path d="M5 132V45h88v87M347 132V45h88v87M0 45h98l-7-8H12zM342 45h98l-12-8h-79zM94 132V64h62v68M284 132V64h62v68M91 64h68l-6-8h-55zM281 64h68l-7-8h-54zM155 137V47h130v90M149 47h142l-14-11H163zM173 137V62h94v75M181 137V71h78v66M167 63h106M177 73h86M170 89h100M170 112h100M210 137v-21h20v21M198 35V24h44v11M195 24h50l-25-13z"/><rect x="13" y="53" width="72" height="75" fill="url(#windows)"/><rect x="355" y="53" width="72" height="75" fill="url(#windows)"/><rect x="102" y="71" width="47" height="62" fill="url(#windows)"/><rect x="291" y="71" width="47" height="62" fill="url(#windows)"/><rect x="187" y="78" width="67" height="55" fill="url(#windows)"/><path d="M163 50v86m114-86v86M174 55h92M185 58h70M0 137c12-18 26-20 36-9 6-23 27-23 36-6 10-15 23-13 31 1 8-12 23-12 33 0 10-8 23-5 29 12 9-11 25-10 32 2 10-12 27-12 36 0 8-12 23-13 32-2 6-17 19-20 29-12 10-12 25-12 33 0 8-14 21-16 31-1 9-17 30-17 36 6 10-11 24-9 36 9M20 28c0-9 13-12 19-5 4-13 22-13 26 0 9-8 20-4 20 5H20zM352 28c0-9 13-12 19-5 4-13 22-13 26 0 9-8 20-4 20 5h-65zM104 43c3-7 12-8 17-3 4-10 18-10 22 0h22M284 39h18c4-10 18-10 22 0 5-5 14-4 17 3"/></g></svg>`;
document.querySelectorAll('.art').forEach((el,i)=>el.innerHTML=svg.replaceAll('windows','windows'+i));
for(let i=0;i<12;i++){const p=document.createElement('i');p.className='petal';p.style.cssText=`--x:${8+i*7}%;--d:${i*.6}s`;document.getElementById('cover').append(p)}
const stage=document.getElementById('stage'),cover=document.getElementById('cover'),letter=document.getElementById('letter'),music=document.getElementById('music');let ctx,master,timer,playing=false,step=0;const audio=invitation.musicUrl?new Audio(invitation.musicUrl):null;if(audio)audio.loop=true;
// 内置原创五声音阶示例旋律，通过 Web Audio 合成，无外部音频依赖。
const melody=[0,4,7,9,7,4,2,4,0,2,4,7,4,2,0,-3,0,4,7,12,9,7,4,7,9,7,4,2,4,0,-3,0];
function note(midi,when,length,gain){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(gain,when+.025);g.gain.exponentialRampToValueAtTime(.001,when+length);o.connect(g);g.connect(master);o.start(when);o.stop(when+length+.1)}
function schedule(){const t=ctx.currentTime+.04;note(72+melody[step%melody.length],t,1.4,.17);if(step%4===0){note(48+[0,5,7,0][Math.floor(step/4)%4],t,2.8,.09)}step++;}
async function setMusic(on){try{if(on){if(audio)await audio.play();else{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(!master){master=ctx.createGain();master.gain.value=.65;master.connect(ctx.destination);}await ctx.resume();schedule();timer=setInterval(schedule,650)}}else{if(audio)audio.pause();else{clearInterval(timer);if(ctx)await ctx.suspend()}}playing=on;music.classList.toggle('playing',on);music.setAttribute('aria-pressed',String(on));music.setAttribute('aria-label',on?'暂停示例音乐':'播放示例音乐');music.title=on?'暂停示例音乐':'播放示例音乐';music.textContent=on?'♫':'♪'}catch(e){playing=false;music.title='音乐未能播放，请再次点击';music.setAttribute('aria-label','音乐未能播放，请再次点击')}}
music.onclick=()=>setMusic(!playing);document.getElementById('open').onclick=()=>{stage.classList.add('opened');cover.inert=true;letter.inert=false;document.getElementById('back').focus({preventScroll:true});if(!playing)setMusic(true)};document.getElementById('back').onclick=()=>{stage.classList.remove('opened');cover.inert=false;letter.inert=true;document.getElementById('open').focus({preventScroll:true});letter.scrollTop=0};document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setMusic(false)});
</script></body></html>
